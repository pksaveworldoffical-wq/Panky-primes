<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankey Primes - Episodes</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #000;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 1;
}
.top-section {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}
h1 {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: 4vw;
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0.3vw 0.3vw 1vw #000;
    padding: 2%;
    margin-top: 4%;
    margin-bottom: 0;
    width: 80%;
    border: 0.2vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    letter-spacing: 0.5vw;
}
.back-link {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.2vw;
    text-decoration: none;
    margin-top: 1.5%;
    border: 0.15vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    padding: 0.6% 1.5%;
}
.spacer {
    flex: 1 1 auto;
    min-height: 4%;
}
.season-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    width: 90%;
    max-width: 1100px;
    padding-bottom: 4%;
    margin-top: 4%;
}
.season-link {
    text-decoration: none;
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.4vw;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.15vw;
    width: 26%;
    margin: 2%;
}
.thumbnail {
    width: 100%;
    display: block;
    border: 0.2vw solid #660000;
    margin-bottom: 3%;
}

@media (max-width: 700px) {
    h1 {
        font-size: 7vw;
        margin-top: 8%;
    }
    .back-link {
        font-size: 3vw;
        padding: 1.5% 3%;
    }
    .season-link {
        font-size: 4vw;
        width: 42%;
        margin: 3%;
    }
    .thumbnail {
        border-width: 0.4vw;
        margin-bottom: 4%;
    }
}
</style>
</head>
<body>
<div class="top-section">
    <h1>You have reached Pankey primes website</h1>
    <a href="index.html" class="back-link">&larr; Back to Home</a>
</div>
<div class="spacer"></div>
<div class="season-container">
    <a href="https://youtu.be/cQEc2cLl8UU?si=jvDemDwfnaGAPq-Q" class="season-link">
        <img src="https://i.ytimg.com/vi/cQEc2cLl8UU/hqdefault.jpg" alt="Episode 1" class="thumbnail">
        Episode 1
    </a>
    <a href="https://youtu.be/0Egz7UJcrgg?si=Bj7_Nu8cq19A05zb" class="season-link">
        <img src="https://i.ytimg.com/vi/0Egz7UJcrgg/hqdefault.jpg" alt="Episode 2" class="thumbnail">
        Episode 2
    </a>
    <a href="https://youtu.be/7T6x_H4IAAc?si=MsbbLD_yJQwQhwQL" class="season-link">
        <img src="https://i.ytimg.com/vi/7T6x_H4IAAc/hqdefault.jpg" alt="Episode 3" class="thumbnail">
        Episode 3
    </a>
</div>
</body>
</html>
