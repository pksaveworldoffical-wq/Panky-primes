<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankey Primes - Episodes</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}
body {
    background-color: #000;
}
.hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
}
.hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 1;
}
.top-section {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}
h1 {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(1.4rem, 4vw, 2.8rem);
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0.3vw 0.3vw 1vw #000;
    padding: 2%;
    margin-top: 0;
    margin-bottom: 0;
    width: 80%;
    border: 0.2vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    letter-spacing: 0.5vw;
}
.back-link {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.85rem, 1.2vw, 1.1rem);
    text-decoration: none;
    margin-top: 4%;
    border: 0.15vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    padding: 0.6% 1.5%;
}
.scroll-hint {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.75rem, 1.4vw, 1rem);
    letter-spacing: 0.2vw;
    text-transform: uppercase;
    opacity: 0.85;
    animation: bob 1.8s ease-in-out infinite;
    text-align: center;
}
.scroll-hint .arrow {
    font-size: 1.4em;
    line-height: 1;
    margin-top: 2%;
}
@keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
}
.episodes-section {
    position: relative;
    width: 100%;
    background-color: #0a0000;
    padding: 6% 5%;
    display: flex;
    justify-content: center;
}
.season-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 1100px;
}
.season-link {
    text-decoration: none;
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.4vw;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.15vw;
    width: 26%;
    margin: 2%;
}
.thumbnail {
    width: 100%;
    display: block;
    border: 0.2vw solid #660000;
    margin-bottom: 3%;
}

@media (max-width: 700px) {
    .back-link {
        font-size: 3vw;
        padding: 1.5% 3%;
    }
    .season-link {
        font-size: 4vw;
        width: 42%;
        margin: 3%;
    }
    .thumbnail {
        border-width: 0.4vw;
        margin-bottom: 4%;
    }
    .episodes-section {
        padding: 10% 5%;
    }
}
</style>
</head>
<body>
<div class="hero">
    <div class="top-section">
        <h1>Episodes</h1>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>
    <div class="scroll-hint">
        Scroll down for episodes
        <div class="arrow">&darr;</div>
    </div>
</div>
<div class="episodes-section">
    <div class="season-container">
        <a href="https://youtu.be/cQEc2cLl8UU?si=jvDemDwfnaGAPq-Q" class="season-link">
            <img src="https://i.ytimg.com/vi/cQEc2cLl8UU/hqdefault.jpg" alt="Episode 1" class="thumbnail">
            Episode 1
        </a>
        <a href="https://youtu.be/0Egz7UJcrgg?si=Bj7_Nu8cq19A05zb" class="season-link">
            <img src="https://i.ytimg.com/vi/0Egz7UJcrgg/hqdefault.jpg" alt="Episode 2" class="thumbnail">
            Episode 2
        </a>
        <a href="https://youtu.be/7T6x_H4IAAc?si=MsbbLD_yJQwQhwQL" class="season-link">
            <img src="https://i.ytimg.com/vi/7T6x_H4IAAc/hqdefault.jpg" alt="Episode 3" class="thumbnail">
            Episode 3
        </a>
    </div>
</div>
</body>
</html>
