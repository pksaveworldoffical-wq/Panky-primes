<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankey Primes - Episodes</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}
body {
    background-color: #000;
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 0;
}
.page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex: 0 1 auto;
}
h1 {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(1.2rem, 4vw, 2.6rem);
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0.3vw 0.3vw 1vw #000;
    padding: 2.5%;
    margin-top: 3vh;
    margin-bottom: 0;
    width: 82%;
    border: 0.2vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    letter-spacing: 0.4vw;
}
.back-link {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.8rem, 1.2vw, 1.1rem);
    text-decoration: none;
    margin-top: 2vh;
    border: 0.15vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    padding: 0.6% 1.5%;
}
.season-container {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    align-items: center;
    width: 92%;
    max-width: 1100px;
    padding: 3vh 0;
}
.season-link {
    text-decoration: none;
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.75rem, 1.4vw, 1.2rem);
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.1vw;
    width: 26%;
    margin: 1.5%;
}
.thumbnail {
    width: 100%;
    display: block;
    border: 0.2vw solid #660000;
    margin-bottom: 4%;
}

@media (max-width: 700px) {
    h1 {
        font-size: clamp(1rem, 6vw, 1.7rem);
        margin-top: 2vh;
        width: 88%;
    }
    .back-link {
        margin-top: 1.5vh;
    }
    .season-link {
        font-size: clamp(0.75rem, 3.6vw, 1.1rem);
        width: 42%;
        margin: 2.5%;
    }
    .thumbnail {
        border-width: 0.4vw;
        margin-bottom: 5%;
    }
}

@media (max-height: 600px) {
    h1 {
        font-size: clamp(0.9rem, 4vw, 1.4rem);
        margin-top: 1.5vh;
        padding: 1.5%;
    }
    .back-link {
        margin-top: 1vh;
    }
    .season-container {
        padding: 1.5vh 0;
    }
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="page">
    <div class="top-section">
        <h1>Episodes</h1>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>
    <div class="season-container">
        <a href="https://youtu.be/cQEc2cLl8UU?si=jvDemDwfnaGAPq-Q" class="season-link">
            <img src="https://i.ytimg.com/vi/cQEc2cLl8UU/hqdefault.jpg" alt="Episode 1" class="thumbnail">
            Episode 1
        </a>
        <a href="https://youtu.be/0Egz7UJcrgg?si=Bj7_Nu8cq19A05zb" class="season-link">
            <img src="https://i.ytimg.com/vi/0Egz7UJcrgg/hqdefault.jpg" alt="Episode 2" class="thumbnail">
            Episode 2
        </a>
        <a href="https://youtu.be/7T6x_H4IAAc?si=MsbbLD_yJQwQhwQL" class="season-link">
            <img src="https://i.ytimg.com/vi/7T6x_H4IAAc/hqdefault.jpg" alt="Episode 3" class="thumbnail">
            Episode 3
        </a>
        <a href="https://youtu.be/c2EXL__MSCs?si=iMF-4hcRI-II20-N" class="season-link">
            <img src="https://i.ytimg.com/vi/c2EXL__MSCs/hqdefault.jpg" alt="Episode 4" class="thumbnail">
            Episode 4
        </a>
    </div>
</div>
</body>
</html>
