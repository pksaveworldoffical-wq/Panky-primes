<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankey Primes</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
}
body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url('background-front.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #000;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1;
}
.top-section {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex: 0 1 auto;
    min-height: 0;
}
h1 {
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(1.1rem, 4vw, 2.6rem);
    text-align: center;
    text-transform: uppercase;
    text-shadow: 0.3vw 0.3vw 1vw #000;
    padding: 3%;
    margin-top: 4vh;
    margin-bottom: 0;
    width: 82%;
    border: 0.2vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    letter-spacing: 0.3vw;
    line-height: 1.3;
}
.spacer {
    flex: 1 1 auto;
    min-height: 2vh;
}
.bottom-bar {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 6% 4vh 6%;
    flex: 0 0 auto;
}
.menu-button {
    display: inline-block;
    text-align: center;
    text-decoration: none;
    color: #b30000;
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(0.9rem, 1.8vw, 1.4rem);
    font-weight: bold;
    letter-spacing: 0.15vw;
    text-transform: uppercase;
    padding: 3% 6%;
    border: 0.15vw solid #660000;
    background: rgba(10, 0, 0, 0.7);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}
.menu-button:hover {
    background: rgba(179, 0, 0, 0.3);
}

@media (max-width: 700px) {
    h1 {
        font-size: clamp(1rem, 6vw, 1.8rem);
        margin-top: 3vh;
        width: 88%;
    }
    .menu-button {
        font-size: clamp(0.85rem, 4vw, 1.2rem);
        padding: 4% 6%;
    }
    .bottom-bar {
        padding: 0 5% 3vh 5%;
    }
}

@media (max-height: 500px) {
    h1 {
        font-size: clamp(0.9rem, 4vw, 1.4rem);
        margin-top: 2vh;
        padding: 2%;
    }
    .bottom-bar {
        padding: 0 5% 2vh 5%;
    }
    .menu-button {
        padding: 2.5% 5%;
    }
}
</style>
</head>
<body>
<div class="top-section">
    <h1>You have reached Pankey primes website</h1>
</div>
<div class="spacer"></div>
<div class="bottom-bar">
    <a href="http://youtube.com/post/Ugkx9ukDeqCKyv15rl8jqKwjf4FWKFHbhIAq?si=xQEpvsvzwlzyf3ja" class="menu-button" target="_blank" rel="noopener">Vote</a>
    <a href="https://pksaveworldoffical-wq.github.io/Panky-primes/episodes.html" class="menu-button">Episodes</a>
</div>
</body>
</html>
