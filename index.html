<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pankey Primes</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        h1 {
            position: relative;
            z-index: 2;
            color: #b30000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 5vw;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0.3vw 0.3vw 1vw #000;
            padding: 2%;
            margin-top: 5%;
            width: 80%;
            border: 0.2vw solid #660000;
            background: rgba(10, 0, 0, 0.7);
            letter-spacing: 0.5vw;
        }

        .season-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2%;
            width: 40%;
        }

        .season-link {
            text-decoration: none;
            color: #b30000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2vw;
            font-weight: bold;
            margin-bottom: 3%;
        }

        .thumbnail {
            width: 100%;
            border: 0.2vw solid #660000;
            margin-bottom: 1%;
        }
    </style>
</head>
<body>

    <h1>You have reached Pankey primes website</h1>

    <div class="season-container">
        <a href="https://youtu.be/cQEc2cLl8UU" class="season-link">
            <img src="https://i.ytimg.com/vi/cQEc2cLl8UU/maxresdefault.jpg" alt="Season 1" class="thumbnail">
            Season 1
        </a>
        <a href="https://youtu.be/0Egz7UJcrgg" class="season-link">
            <img src="https://i.ytimg.com/vi/0Egz7UJcrgg/maxresdefault.jpg" alt="Season 2" class="thumbnail">
            Season 2
        </a>
    </div>

</body>
</html>
